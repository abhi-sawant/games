<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Free offline Minesweeper with three difficulty levels." />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Minesweeper</title>
  </head>
  <body>
    <div id="app">
      <!-- Home -->
      <section id="home" class="screen">
        <div class="home-inner">
          <a href="/" class="back-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
            <span>All games</span>
          </a>
          <h1 class="logo">Minesweeper</h1>
          <p class="tagline">Tap to dig, hold to flag.</p>

          <button id="continue-btn" class="btn btn-primary continue" hidden>
            <span>Continue</span>
            <small id="continue-meta"></small>
          </button>

          <h2 class="section-label">New game</h2>
          <div class="levels" id="levels"></div>

          <button id="history-btn" class="btn history-link">
            <span>History &amp; stats</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
          </button>
        </div>
      </section>

      <!-- History -->
      <section id="history" class="screen" hidden>
        <header class="topbar">
          <button id="history-back-btn" class="icon-btn" aria-label="Back to menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <h1 class="topbar-title">History</h1>
          <span class="icon-btn" aria-hidden="true"></span>
        </header>

        <table class="summary">
          <thead>
            <tr><th></th><th scope="col">Played</th><th scope="col">Won</th><th scope="col">Best</th><th scope="col">Avg</th></tr>
          </thead>
          <tbody id="history-summary"></tbody>
        </table>

        <h2 class="section-label">Recent games</h2>
        <p id="history-empty" class="history-empty">No finished games yet. Clear a board and it will show up here.</p>
        <ul id="history-list" class="history-list"></ul>
      </section>

      <!-- Game -->
      <section id="game" class="screen" hidden>
        <header class="topbar">
          <button id="back-btn" class="icon-btn" aria-label="Back to menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <div class="meta">
            <span id="level-label"></span>
            <span class="dot">·</span>
            <span id="mines-left"></span>
          </div>
          <button id="timer" class="timer" aria-label="Pause"></button>
        </header>

        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="Minesweeper board"></div>
          <div id="paused" class="paused" hidden>
            <button id="resume-btn" class="btn btn-primary">Resume</button>
          </div>
        </div>

        <div class="tools">
          <button class="tool" id="flag-btn" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4" /><path d="M6 4h11l-3 4 3 4H6" /></svg>
            <span>Flag mode <b id="flag-state">Off</b></span>
          </button>
          <button class="tool" id="restart-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7" /><path d="M4 4v4h4" /></svg>
            <span>New board</span>
          </button>
        </div>
      </section>

      <!-- End-of-game dialog -->
      <dialog id="end-dialog" class="dialog">
        <h2 id="end-title"></h2>
        <p id="end-summary"></p>
        <div class="dialog-actions">
          <button id="end-menu" class="btn">Menu</button>
          <button id="end-again" class="btn btn-primary">Play again</button>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/minesweeper/main.ts"></script>
  </body>
</html>
